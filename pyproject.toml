[project]
name = "hint-meet"
version = "0.0.1"
description = "Realtime meeting-copilot: Whisper-transcriptie, Jev als beslissingslaag, KB-RAG en Claude-advies."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "pyyaml",
    "anthropic",
    "lancedb",
]

[project.optional-dependencies]
kb-prep = ["python-docx", "openpyxl", "python-pptx", "pymupdf", "markdownify"]
ocr = ["pytesseract", "pillow"]
dev = ["pytest"]

[project.scripts]
hint-meet = "hint_meet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
