[project]
name = "hint-meet"
version = "0.0.1"
description = "Real-time meeting copilot: Whisper transcription, Jev as decision layer, KB retrieval and Claude advice."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
    "pyyaml",
    "python-dotenv",
    "anthropic",
    "typesafe-sdk",
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embeddings; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
kb-prep = ["python-docx", "openpyxl", "python-pptx", "pymupdf", "markdownify", "xlrd",
           "pytesseract", "pillow", "pathspec"]
ocr = ["pytesseract", "pillow"]  # zit nu ook in kb-prep; blijft voor oudere installatie-instructies
dev = ["pytest"]

[project.scripts]
hint-meet = "hint_meet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
