# Instellingen voor de pijplijn: zoeken → gate → advies.
# Kalibreren met: hint-meet replay data/eval/acme-gesprek.txt
window_turns: 3            # zoveel laatste beurten gaan naar gate en advies

gate:
  provider: jev            # jev | claude (Haiku, als terugvaloptie)
  model: claude-haiku-4-5  # voor provider claude
  jev_model: jev-latest    # voor provider jev; het werkelijke model (bv. jev-1.13.0) wordt gelogd
  intervene_min: 0.55      # Jev; gekalibreerd 5-10-2026 (Haiku had 0.7 nodig)
  urgency_min: 1           # 0-4

moments:                   # Choice: wat voor moment is dit
  - vraag_aan_mij
  - onjuiste_bewering
  - risico
  - toezegging
  - smalltalk
  - overig

kb:
  query_turns: 2           # zoveel laatste beurten vormen de zoekvraag
  gate_passages: 3         # zoveel passages ziet de gate
  advise_passages: 6       # zoveel passages ziet het advies

advise:
  model: claude-opus-5-5
  effort: low              # snelheid boven diepgang; het advies is kort
  max_sentences: 3
  max_words: 40            # in een paar seconden te lezen
