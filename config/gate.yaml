# Pipeline settings: search → gate → advice.
# Calibrate with: hint-meet replay data/eval/acme-gesprek.txt
window_turns: 3            # this many last turns go to gate and advice

gate:
  provider: jev            # jev | claude (Haiku, as a fallback)
  model: claude-haiku-4-5  # for provider claude
  jev_model: jev-latest    # for provider jev; the actual model (e.g. jev-1.13.0) is logged
  intervene_min: 0.55      # Jev; calibrated 5-10-2026 (Haiku needed 0.7)
  urgency_min: 1           # 0-4

moments:                   # Choice: what kind of moment is this (values are used in the code; keep them)
  - vraag_aan_mij
  - onjuiste_bewering
  - risico
  - toezegging
  - smalltalk
  - overig

rerank:                    # Jev scores every passage (only with gate provider jev)
  enabled: true
  min_relevance: 0.5       # advice only uses passages at least this relevant; none left = silence
  max_injection: 0.5       # passages that look like instructions to an AI are dropped
  find_min_relevance: 0.5  # Find Documents shows documents at least this relevant
  timeout_s: 3             # Jev slower than this (after the gate): advise without filtering

kb:
  query_turns: 2           # this many last turns form the search query
  gate_passages: 3         # this many passages are shown to the gate
  advise_passages: 6       # this many passages are shown to the advisor

advise:
  model: claude-sonnet-5-5 # chosen 5-10-2026: first words ±1.1 s (Opus 5.5: ±4.3 s)
  thinking: between_tools  # Sonnet 5.5: thinking off; only with effort high or lower
  effort: low              # speed over depth; the advice is short
  max_points: 4            # bullet points, 1 to 4 short points
  max_words: 40            # readable in a few seconds
